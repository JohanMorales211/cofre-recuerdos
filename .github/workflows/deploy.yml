name: Deploy a GitHub Pages

on:
  # Publica en cada push a main
  push:
    branches: [main]
  # Permite lanzarlo a mano desde la pestaña Actions
  workflow_dispatch:

# Permisos que necesita el deploy de Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Evita despliegues solapados
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        # npm install (no "npm ci") para tolerar diferencias de versión de npm
        # entre tu máquina y el runner de GitHub, que hacían fallar a npm ci.
        run: npm install --no-audit --no-fund

      - name: Build estático (SPA con ruta base /cofre-recuerdos/)
        run: npm run build:pages
        env:
          GITHUB_PAGES: "true"

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
